<!doctype html>
<!-- Share card template (1200x630). scripts/og-images.mjs fills it and saves a PNG per card and language. -->
<html>
<head>
<meta charset="utf-8">
<style>
@import url("../css/fonts.css");
@font-face { font-family: 'Syne'; font-weight: 500 700; src: url(../fonts/syne-500-700-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Syne'; font-weight: 500 700; src: url(../fonts/syne-500-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root { --paper: #0a0a0b; --ink: #f2f3f5; --muted: #a1a5ae; --line: #292b30; --accent: #ff7a1a; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
.card { position: relative; width: 1200px; height: 630px; padding: 60px 72px 52px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
/* The thin circle from the project cards, cut by the frame. */
.card::after { content: ""; position: absolute; width: 620px; height: 620px; right: -230px; bottom: -300px; border: 1.5px solid rgb(255 255 255 / .08); border-radius: 50%; }
.top, .bottom { display: flex; justify-content: space-between; align-items: center; font: 500 21px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
.top .domain { color: var(--muted); text-transform: none; letter-spacing: .04em; }
.label b { color: var(--accent); font-weight: 500; margin-right: 18px; }
.middle { align-self: center; display: grid; gap: 22px; max-width: 1000px; }
.title { font: 600 80px/1.02 'Syne', sans-serif; letter-spacing: -.045em; text-wrap: balance; }
.subtitle { font: 400 28px/1.45 'Geist', sans-serif; color: var(--muted); max-width: 900px; }
.name { font: 600 176px/.9 'Syne', sans-serif; letter-spacing: -.06em; }
.name span { display: block; color: var(--accent); }
.bottom { position: relative; z-index: 1; padding-top: 26px; border-top: 1px solid var(--line); text-transform: none; letter-spacing: 0; }
.logo { font: 600 40px/1 'IBM Plex Mono', monospace; letter-spacing: -4px; }
.logo span { color: var(--accent); }
.byline { font: 400 22px/1 'Geist', sans-serif; color: var(--muted); }
.byline strong { color: var(--ink); font-weight: 500; }
.card[data-game] .middle { max-width: 690px; position: relative; z-index: 1; }
.card[data-game] .title { font-size: 72px; }
.card[data-game] .subtitle { font-size: 25px; }
.game-art { position: absolute; right: 70px; top: 175px; width: 310px; height: 250px; }
.fan-card { position: absolute; top: 32px; left: 105px; width: 110px; height: 160px; display: grid; place-items: center; border: 1px solid #555b66; background: #22252b; color: #e4e8ef; border-radius: 4px; font: 54px/1 'IBM Plex Mono', monospace; box-shadow: 0 12px 30px #0008; }
.fan-card:nth-child(1) { transform: translateX(-75px) rotate(-16deg); }
.fan-card:nth-child(2) { transform: translateY(-12px) rotate(2deg); }
.fan-card:nth-child(3) { transform: translateX(75px) rotate(18deg); background: var(--accent); color: #101012; border-color: var(--accent); }
.night-art { overflow: hidden; border: 1px solid #292b30; background: radial-gradient(120% 70% at 50% 118%, #7a0f1d, #2a0810 38%, transparent 70%), #08090c; }
.night-art::before { content: ""; position: absolute; top: 35px; right: 52px; width: 95px; height: 95px; border-radius: 50%; box-shadow: -23px 13px 0 #c9d4ea; transform: rotate(-14deg); }
.night-art::after { content: "✦     ✦"; position: absolute; top: 50px; left: 45px; color: #c9d4ea; font-size: 20px; letter-spacing: 25px; }
.night-village { position: absolute; bottom: 0; width: 100%; height: 70px; fill: #050506; }
.card[data-game="games"] .game-art { transform: scale(.82); transform-origin: center; }
</style>
</head>
<body>
<div class="card">
    <div class="top"><p class="label"><b></b><span></span></p><p class="domain">timurhankaya.dev</p></div>
    <div class="middle"></div>
    <div class="bottom"><p class="logo">tkaya<span>.</span></p><p class="byline"><strong>Timurhan Kaya</strong> / <span></span></p></div>
</div>
<script>
// Called by the generator: render({ lang, kind: 'name' | 'title', number, label, title, subtitle, role }) then wait for fonts.
window.render = async (card) => {
    // The language decides capitals: Turkish uppercases i to İ.
    document.documentElement.lang = card.lang;
    const surface = document.querySelector('.card');
    surface.removeAttribute('data-game');
    surface.querySelector('.game-art')?.remove();
    if (['games', 'imposter', 'vampire'].includes(card.kind)) {
        surface.dataset.game = card.kind;
        const art = document.createElement('div');
        art.className = 'game-art' + (card.kind === 'vampire' ? ' night-art' : '');
        art.innerHTML = card.kind === 'vampire'
            ? '<svg class="night-village" viewBox="0 0 320 64" preserveAspectRatio="none"><path d="M0 64V44h22V30l14-12 14 12v14h18V36l10-8 10 8v8h26V22l18-16 18 16v22h20V34l12-10 12 10v10h22V28l16-14 16 14v16h24V38l9-7 9 7v6h20v20Z"/></svg>'
            : '<span class="fan-card">?</span><span class="fan-card">?</span><span class="fan-card">!</span>';
        surface.append(art);
    }
    const number = document.querySelector('.label b');
    number.textContent = card.number ? card.number + ' /' : '';
    number.hidden = !card.number;
    document.querySelector('.label span').textContent = card.label;
    document.querySelector('.byline span').textContent = card.role;
    const middle = document.querySelector('.middle');
    middle.innerHTML = '';
    if (card.kind === 'name') {
        const name = document.createElement('h1');
        name.className = 'name';
        name.innerHTML = 'Timurhan<span>Kaya.</span>';
        middle.append(name);
    } else {
        const title = document.createElement('h1');
        title.className = 'title';
        title.textContent = card.title;
        middle.append(title);
        if (card.subtitle) {
            const sub = document.createElement('p');
            sub.className = 'subtitle';
            sub.textContent = card.subtitle;
            middle.append(sub);
        }
        // Shrink long titles until the middle row fits between the label and the footer.
        await document.fonts.ready;
        let size = 80;
        const room = middle.parentElement.clientHeight - 60 - 52 - 110;
        while (middle.scrollHeight > room && size > 48) {
            size -= 4;
            title.style.fontSize = size + 'px';
        }
    }
    await document.fonts.ready;
};
</script>
</body>
</html>
